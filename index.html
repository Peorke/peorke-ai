<title>بيوركي AI</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#b89a6a;--panel:#e9d8b6;--ink:#2b1d0e;--me:#5a3b1c;--meink:#fff;--bot:#fff6e2;--ac:#7a4f24;--line:#8a6a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a0e;--panel:#35271a;--ink:#f3e6cc;--me:#c08a4c;--meink:#1d1307;--bot:#463420;--ac:#d9a45f;--line:#6a4f2c}}
:root[data-theme="dark"]{--bg:#241a0e;--panel:#35271a;--ink:#f3e6cc;--me:#c08a4c;--meink:#1d1307;--bot:#463420;--ac:#d9a45f;--line:#6a4f2c}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:3px solid var(--line)}
#av{width:52px;height:52px;image-rendering:pixelated;border:3px solid var(--line);flex:none;animation:fl 3s ease-in-out infinite}
#av.blink{animation:fl 3s ease-in-out infinite,bl .18s}
#av.think{animation:th .5s ease-in-out infinite}
#av.talk{animation:tk .28s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes bl{50%{filter:brightness(.55)}}
@keyframes th{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.05)}}
@keyframes tk{50%{transform:scale(1.1,.94)}}
h1{font:11px/1.4 "Press Start 2P",monospace;margin:0;flex:1}
h1 small{display:block;font:12px Tajawal,sans-serif;opacity:.7;margin-top:4px}
button,select{font:inherit;color:var(--ink);background:var(--bot);border:2px solid var(--line);padding:6px 10px;cursor:pointer;border-radius:0}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 12px;white-space:pre-wrap;line-height:1.7;border:2px solid var(--line)}
.b{background:var(--bot);align-self:flex-start}
.u{background:var(--me);color:var(--meink);align-self:flex-end}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px}
.chips button{white-space:nowrap;background:var(--panel)}
form,.row{display:flex;gap:8px;padding:8px 12px 12px}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bot);border:2px solid var(--line);padding:8px;height:46px;border-radius:0}
#send{background:var(--ac);color:var(--bg);font-weight:700}
#side{position:fixed;inset:0;background:#000a;display:none;z-index:5}
#side.on{display:block}
#sp{width:min(300px,85%);height:100%;background:var(--panel);padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:6px}.ci button:first-child{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.cur button:first-child{background:var(--ac);color:var(--bg)}
@media(prefers-reduced-motion:reduce){#av{animation:none!important}}
</style></head><body><div id="app">

const $=s=>document.querySelector(s);
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LN=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?Capacitor.Plugins.LocalNotifications:null;
let chats=S.get('pk_chats',[]),cur=S.get('pk_cur',null),rem=S.get('pk_rem',[]),busy=false;
const log=$('#log'),av=$('#av'),st=$('#st');
$('#snd').value=S.get('pk_snd',0);$('#snd').onchange=e=>{S.set('pk_snd',+e.target.value);beep(+e.target.value)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const AD=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const IDEAS=['هاردكور بدون ما أنام أول ليلة','أصعب مود هاردكور جربته: كم أعيش؟','شرح مود جديد خلال 5 دقائق','تحدي: أنهي اللعبة بدون أدوات حديد','أفضل 5 مودات هاردكور هذا الشهر','باك بيوركي: كل اللي تحتاجه في فيديو واحد','شرح تثبيت المودات للمبتدئين خطوة خطوة','هاردكور مع مود رعب: هل أنجو؟'];
const TITLES=['عشت 100 يوم هاردكور بهذا المود… وصار شي ما توقعته','هاردكور لكن المود يبي يقتلني!','أقوى باك بيوركي: طريقة التحميل والشرح','لا تنزل هذا المود قبل تشوف الفيديو','كيف تركّب المودات بدقيقتين؟'];
const CH=['اختر فيديو اليوم: ','أنا أشوف الأفضل: '];
function now(){return new Date()}
function fmt(d){return d.toLocaleString('ar',{weekday:'long',hour:'numeric',minute:'2-digit'})}
function parseWhen(t){t=AD(t);const n=now();let m;
 if(m=t.match(/بعد\s*(\d+)?\s*(دقيقتين|دقيق[ةه]|دقائق|ساعتين|ساعتان|ساع[ةه]|ساعات)/)){const k=m[1]?+m[1]:(/تين|تان/.test(m[2])?2:1);const min=/دقيق|دقائق/.test(m[2])?k:k*60;return{d:new Date(+n+min*6e4),rest:t.replace(m[0],'')}}
 if(m=t.match(/الساع[ةه]\s*(\d{1,2})(?::(\d{2}))?(?:\s*(مساء|صباحا|صباح|عصر|ظهر|ليل|ص|م)(?![\u0621-\u064A]))?/)){
  let h=+m[1],mi=+(m[2]||0),p=m[3]||'';
  if(/^(م|مساء|عصر|ليل)/.test(p)&&h<12)h+=12;else if(!p&&h<7)h+=12;
  const day=/بكر[ةه]|غدا|غداً/.test(t)?1:0;const d=new Date(n);d.setDate(d.getDate()+day);d.setHours(h,mi,0,0);
  if(d<=n&&!day)d.setDate(d.getDate()+1);
  return{d,rest:t.replace(m[0],'')}}
 return null}
function reply(text){
 if(/اختار|احتار|حيرني/.test(text)){const o=text.replace(/اختار لي|اختر لي/,'').split(/[،,]| أو /).map(s=>s.trim()).filter(Boolean);
  return pick(CH)+(o.length>1?pick(o):pick(IDEAS))+'\n\nقراري نهائي، ابدأ الحين!'}
 if(/تذكيرات|تنبيهات/.test(text)){const a=rem.filter(r=>!r.done);return a.length?'تنبيهاتك القادمة:\n'+a.map(r=>'• '+r.t+' — '+fmt(new Date(r.at))).join('\n'):'ما عندك تنبيهات. جرّب: ذكرني بالتصوير الخميس الساعة 6 مساء'}
 if(/ذكرني|ذكّرني|نبهني|نبّهني|اضبط|ضبط/.test(text)){
  const w=parseWhen(text);if(!w)return'ما فهمت الوقت. اكتب مثل: «الساعة 8 مساء» أو «بعد ساعتين» أو «بكرة الساعة 5».';
  const t=w.rest.replace(/ذكرني|ذكّرني|نبهني|نبّهني|اضبط لي|اضبط|ضبط|بكر[ةه]|غدا|غداً/g,' ').replace(/\s+/g,' ').trim().replace(/^(ب|في|ان|أن)(?=\s|$)\s*/,'').replace(/^ب(?=[\u0621-\u064A]{3})/,'').trim()||'تنبيه';
  rem.push({id:Date.now(),t,at:+w.d});S.set('pk_rem',rem);
  if(LN)LN.requestPermissions().then(()=>LN.schedule({notifications:[{id:Math.floor(Date.now()/1000)%2147483647,title:'بيوركي AI',body:t,schedule:{at:w.d,allowWhileIdle:true}}]})).catch(()=>{});
  if('Notification' in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(e){}
  return'تم ✅ بذكّرك: «'+t+'»\nالوقت: '+fmt(w.d)+''+(LN?'\nراح يرن حتى لو التطبيق مقفول.':'\n(خلّ التطبيق مفتوح عشان يرن)')}
 if(/عنوان|عناوين/.test(text))return'عنوان مقترح:\n«'+pick(TITLES)+'»'
 if(/فكر|أفكار|افكار|فيديو/.test(text))return'فكرة فيديو:\n• '+pick(IDEAS)+'\n\nتبيني أحوّلها لمهمة وتنبيه؟'
 if(/مرحب|هلا|السلام|اهلا|أهلا/.test(text))return'هلا والله! أنا بيوركي AI، مدير أعمال قناتك. اسألني عن أفكار، عناوين، أو خلّني أذكّرك بمواعيدك.'
 return'فهمت. أقدر أساعدك في:\n• أفكار فيديو (هاردكور، مودات، شروحات)\n• عناوين\n• «اختار لي»\n• تنبيهات: «ذكرني بـ… الساعة 8 مساء»\n\nالنموذج الذكي الكامل يجي في الخطوة الجاية.'}
function C(){let c=chats.find(x=>x.id===cur);if(!c){c={id:Date.now(),title:'محادثة جديدة',msgs:[{r:'b',t:'هلا! أنا بيوركي AI، مدير أعمال قناتك. وش نسوي اليوم؟'}]};chats.unshift(c);cur=c.id;save()}return c}
function save(){S.set('pk_chats',chats);S.set('pk_cur',cur)}
function add(r,t,anim){const d=document.createElement('div');d.className='m '+r;log.appendChild(d);
 if(!anim){d.textContent=t;log.scrollTop=log.scrollHeight;return Promise.resolve()}
 av.className='talk';st.textContent='يتكلم…';let i=0;return new Promise(res=>{const iv=setInterval(()=>{d.textContent=t.slice(0,++i);log.scrollTop=log.scrollHeight;if(i>=t.length){clearInterval(iv);av.className='';st.textContent='مدير أعمالك جاهز';res()}},18)})}
function render(){log.innerHTML='';C().msgs.forEach(m=>add(m.r,m.t,false));renderList()}
function renderList(){const l=$('#list');l.innerHTML='';chats.forEach(c=>{const d=document.createElement('div');d.className='ci'+(c.id===cur?' cur':'');
 const a=document.createElement('button');a.textContent=c.title;a.onclick=()=>{cur=c.id;save();render();$('#side').classList.remove('on')};
 const x=document.createElement('button');x.textContent='🗑';x.setAttribute('aria-label','حذف');x.onclick=()=>{chats=chats.filter(z=>z.id!==c.id);if(cur===c.id)cur=null;save();render()};
 d.append(a,x);l.appendChild(d)})}
async function send(text){text=text.trim();if(!text||busy)return;busy=true;const c=C();
 c.msgs.push({r:'u',t:text});if(c.title==='محادثة جديدة')c.title=text.slice(0,28);save();await add('u',text,false);renderList();
 av.className='think';st.textContent='يفكر…';await new Promise(r=>setTimeout(r,700));
 const out=reply(text);c.msgs.push({r:'b',t:out});save();await add('b',out,true);busy=false}
$('#send').onclick=()=>{const v=$('#in').value;$('#in').value='';send(v)};
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
$('#menu').onclick=()=>$('#side').classList.add('on');
$('#side').onclick=e=>{if(e.target.id==='side')$('#side').classList.remove('on')};
$('#new').onclick=()=>{cur=null;C();render();$('#side').classList.remove('on')};
let ac;function beep(k){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const seq=[[[220,.08],[165,.12]],[[880,.15],[1320,.3]],[[988,.08],[1319,.35]]][k];let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=k===0?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
setInterval(()=>{const n=+now();rem.forEach(r=>{if(!r.done&&r.at<=n){r.done=true;S.set('pk_rem',rem);beep(+$('#snd').value);
 try{if(!LN&&Notification.permission==='granted')new Notification('بيوركي AI',{body:r.t})}catch(e){}
 const c=C();const t='⏰ تذكير: '+r.t;c.msgs.push({r:'b',t});save();add('b',t,false)}})},3000);
setInterval(()=>{av.classList.add('blink');setTimeout(()=>av.classList.remove('blink'),200)},4000);
render();
</script></body></html>
